[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "col-snap"
version = "0.1.0"
description = "Line up the columns of ad-hoc text tables, CSV snippets and markdown tables"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "landry-some" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
colsnap = "col_snap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
